# ========================
# Application Configuration
# ========================
spring.application.name=JobPortalAPI

# ---- Secrets ----
# DB_PASSWORD and JWT_SECRET are read from environment variables or from the
# gitignored application-local.properties (see application-local.properties.example).
spring.config.import=optional:classpath:application-local.properties

# ---- Database ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ---- File Upload ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=./uploads

# ---- Server ----
server.port=8080

# ---- CORS ----
app.cors.allowed-origins=http://localhost:5173
